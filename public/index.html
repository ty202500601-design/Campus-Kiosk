<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolBites</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 10 10%27><text y=%278.5%27 font-size=%278%27>🍴</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{--red:#d62839;--red-d:#b01e2d;--tint:#fdecee;--ink:#1d1d22;--mut:#6b6b76;--line:#ececf0;--ok:#1f9d55;--bg:#fafafb}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#side{position:fixed;inset:0 auto 0 0;width:250px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}.logo i{font-style:normal;background:var(--red);color:#fff;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px}.logo b{font-size:19px;display:block;line-height:1.1}.logo small{color:var(--mut);font-size:12px}
.nv{display:flex;align-items:center;gap:12px;border:0;background:none;padding:13px 14px;border-radius:12px;font-weight:600;color:var(--ink);text-align:left;min-height:48px}.nv:hover{background:var(--tint)}.nv.on{background:var(--red);color:#fff}.nv span{width:24px;text-align:center}
.bd{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;padding:0 8px;font-size:13px}.on .bd{background:#fff;color:var(--red)}
.who{margin-top:auto;padding:12px;border-radius:12px;background:var(--bg);font-size:14px}.who small{color:var(--mut);display:block}
main{margin-left:250px;padding:28px 32px;max-width:1200px}h1{margin:0 0 4px;font-size:28px}h2{font-size:20px;margin:28px 0 12px}.sub{color:var(--mut);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.pic{height:96px;border-radius:12px;background:var(--tint);display:grid;place-items:center;font-size:52px}.price{font-weight:700;color:var(--red);font-size:18px}.mut{color:var(--mut);font-size:14px}
.btn{border:0;background:var(--red);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;min-height:46px}.btn:hover{background:var(--red-d)}.btn:disabled{background:#c9c9d1;cursor:not-allowed}.btn.o{background:#fff;color:var(--red);border:2px solid var(--red)}.btn.s{padding:7px 12px;min-height:34px;font-size:14px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--tint);color:var(--red)}.tag.g{background:#e6f6ec;color:var(--ok)}.tag.x{background:#eee;color:#666}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:9px 16px;font-weight:600}.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.bar{display:flex;gap:10px;flex-wrap:wrap}.bar input,.bar select,.f input,.f select,.f textarea{padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;width:100%}.bar input{flex:1;min-width:200px;width:auto}.bar select{width:auto}
.hero{background:linear-gradient(120deg,var(--red),#ef4a58);color:#fff;border-radius:22px;padding:28px;margin-bottom:20px}.hero h1{font-size:32px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.line{padding:12px 0;border-top:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;gap:10px}.qty button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}.f label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
.steps{display:flex;gap:4px;margin:8px 0}.steps i{flex:1;height:7px;border-radius:9px;background:var(--line)}.steps i.d{background:var(--red)}
.ov{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:9;padding:16px}.modal{background:#fff;border-radius:22px;padding:24px;width:min(480px,100%);max-height:92vh;overflow:auto}
.opt{display:flex;justify-content:space-between;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer;width:100%;background:#fff;font-weight:500}.opt.on{border-color:var(--red);background:var(--tint)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;z-index:20}#toast.e{background:var(--red)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}td,th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.stat b{font-size:28px;display:block}
.demo{background:#fff8e1;border:1px solid #f3dc8a;border-radius:12px;padding:8px 14px;font-size:13px;margin-bottom:16px}
@media(max-width:900px){#side{position:sticky;top:0;width:auto;flex-direction:row;overflow-x:auto;padding:8px;border:0;border-bottom:1px solid var(--line);z-index:5}.logo,.who{display:none}.nv{white-space:nowrap;padding:10px 12px}main{margin:0;padding:18px 14px}.two{grid-template-columns:1fr}}

body{font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;background:radial-gradient(900px 400px at 100% -10%,#ffe3e6,transparent),var(--bg)}
#side{box-shadow:4px 0 24px #d6283910}.logo i{background:linear-gradient(135deg,#ef4a58,var(--red-d));box-shadow:0 6px 16px #d6283955;transition:transform .4s}.logo:hover i{transform:rotate(-12deg) scale(1.08)}
.nv{transition:background .2s,transform .2s,box-shadow .2s}.nv:hover{transform:translateX(4px)}.nv.on{background:linear-gradient(135deg,#ef4a58,var(--red));box-shadow:0 8px 18px #d6283940}.nv span{transition:transform .25s}.nv:hover span{transform:scale(1.25) rotate(-8deg)}
.bd.pop{animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
.card{box-shadow:0 2px 10px #1d1d2208;transition:transform .25s,box-shadow .25s,border-color .25s}.grid>.card:hover{transform:translateY(-6px);box-shadow:0 16px 32px #d6283922;border-color:#f4b8be}
.pic{background:linear-gradient(135deg,#fff1f2,#ffd9dd);transition:transform .3s}.pic{overflow:hidden}.card:hover .pic{background:linear-gradient(135deg,#ffe3e6,#ffc7cd)}
.card:hover .pic{animation:bob .8s ease-in-out}
.btn{transition:transform .15s,box-shadow .2s,background .2s;box-shadow:0 6px 14px #d6283933}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px #d6283944}.btn:active{transform:scale(.95)}.btn:disabled{box-shadow:none;transform:none}.btn.o{box-shadow:none}
.chip{transition:all .2s}.chip:hover{border-color:var(--red);transform:translateY(-2px)}.chip.on{box-shadow:0 6px 14px #d6283940}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#d62839,#ef4a58,#ff7a85,#d62839);background-size:300% 300%;animation:flow 10s ease infinite;box-shadow:0 16px 40px #d6283940}.hero>*{position:relative;z-index:1}
.fl{position:absolute;font-size:56px;opacity:.28;z-index:0!important;animation:floaty 6s ease-in-out infinite}.f1{right:6%;top:10%}.f2{right:22%;bottom:-6%;animation-delay:-2s}.f3{right:38%;top:-8%;animation-delay:-4s}.f4{right:2%;bottom:6%;animation-delay:-1s}
.tag.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:ring 1.6s infinite}
.steps i{position:relative;overflow:hidden;transform-origin:left}.steps i.cur::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff8,transparent);animation:shine 1.4s infinite}
.ov{backdrop-filter:blur(4px);animation:fade .2s}.modal{animation:modalIn .35s cubic-bezier(.2,1.2,.4,1)}.opt{transition:all .15s}.opt:hover{border-color:var(--red)}.opt.on{transform:scale(1.015)}
#toast{animation:toastIn .35s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 30px #0004}
.fly{position:fixed;z-index:30;font-size:34px;pointer-events:none}.cf{position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;z-index:40;pointer-events:none}
.chk{width:84px;height:84px}.chk circle{fill:none;stroke:var(--ok);stroke-width:4;stroke-dasharray:166;stroke-dashoffset:166;animation:draw .7s .1s forwards}.chk path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:draw .4s .7s forwards}
.enter>*{animation:rise .5s both}.enter .grid>*,.enter .two>*,.enter .hero~*{animation:rise .55s both;animation-delay:calc(var(--i,0)*45ms)}.enter .steps i.d{animation:fill .7s both;animation-delay:calc(var(--n,0)*100ms + .3s)}
table tr{transition:background .15s}table tr:hover td{background:var(--tint)}.stat b{font-size:30px;color:var(--red)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}}@keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(.92)}}@keyframes toastIn{from{opacity:0;transform:translate(-50%,24px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.7)}100%{transform:scale(1)}}@keyframes bob{40%{transform:translateY(-8px) rotate(-4deg)}70%{transform:translateY(0) rotate(3deg)}}
@keyframes flow{50%{background-position:100% 50%}}@keyframes floaty{50%{transform:translateY(-16px) rotate(10deg)}}@keyframes ring{0%{box-shadow:0 0 0 0 #1f9d5588}100%{box-shadow:0 0 0 8px #1f9d5500}}
@keyframes shine{to{transform:translateX(100%)}}@keyframes fill{from{transform:scaleX(0)}}@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.qty{flex-wrap:wrap;justify-content:flex-end}
.qty button.btn{width:auto;height:auto;min-width:0;min-height:38px;padding:7px 16px;margin-left:8px;font-size:14px;font-weight:700;line-height:1.2;border-radius:10px;white-space:nowrap;background:#fff;color:var(--red);border:2px solid var(--red)}
.qty button.btn:hover{background:var(--red);color:#fff}
</style></head><body><nav id="side" aria-label="Main"></nav><main id="app"></main><div id="m"></div><div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),peso=n=>'₱'+(+n).toFixed(2).replace(/\.00$/,''),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=[['Rice Meals','🍛'],['Snacks','🍟'],['Drinks','🥤'],['Desserts','🍩'],['Noodles','🍜'],['Sandwiches','🥪']],STEPS=['Pending Confirmation','Accepted','Preparing','Ready for Pickup','Completed'];
let S={user:null,school:'',canteens:[],foods:[],cart:JSON.parse(localStorage.cart||'[]'),view:'home',cid:'all',q:'',cat:'All',sort:'pop',orders:[],vos:[],stats:null,busy:false,key:crypto.randomUUID(),seen:-1,done:null};
async function api(p,m='GET',b){const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(localStorage.tok||'')},body:b&&JSON.stringify(b)});const j=await(r.headers.get('content-type')||'').includes('json')?r.json():r.text();if(!r.ok)throw new Error(j.error||'Request failed');return j}
function toast(t,e){const x=$('#toast');x.textContent=t;x.className=e?'e':'';x.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>x.hidden=true,3200)}
const save=()=>localStorage.cart=JSON.stringify(S.cart),cnt=()=>S.cart.reduce((s,i)=>s+i.qty,0),cn=id=>S.canteens.find(c=>c.id===id)||{},fd=id=>S.foods.find(f=>f.id===id)||{};
async function login(u){try{const r=await api('login','POST',{username:u,password:'demo'});localStorage.tok=r.token;S.user=r.user;S.view=r.user.role==='student'?'home':r.user.role;await load();render();poll()}catch(e){toast(e.message,1)}}
async function load(){[S.canteens,S.foods]=await Promise.all([api('canteens'),api('foods')]);if(S.user){S.orders=await api('orders');if(S.user.role!=='student'){S.vos=await api('vendor-orders');S.stats=await api('stats')}}}
function go(v,x={}){Object.assign(S,x,{view:v});render();scrollTo(0,0);enter()}
function enter(){const a=$('#app');a.classList.remove('enter');a.querySelectorAll('.grid>*,.two>*,.hero~*').forEach((e,i)=>e.style.setProperty('--i',Math.min(i,14)));void a.offsetWidth;a.classList.add('enter');clearTimeout(enter.t);enter.t=setTimeout(()=>a.classList.remove('enter'),1400)}
function render(){const pc=render.c;render.c=cnt();const u=S.user,it=[['home','🏠','Home'],['canteens','🏪','Browse Canteens'],['menu','🍽️','Food Menu'],['cart','🛒','My Cart'],['orders','🧾','My Orders'],['account','👤','Account']];
 if(u?.role==='vendor')it.push(['vendor','📦','Vendor Dashboard']);if(u?.role==='admin')it.push(['admin','📊','Admin Dashboard']);
 $('#side').innerHTML=`<div class="logo"><i>🍴</i><div><b>SchoolBites</b><small>${esc(S.school)}</small></div></div>`+it.map(([k,i,l])=>`<button class="nv ${S.view==k?'on':''}" data-k="${k}" onclick="go('${k}')"><span>${i}</span>${l}${k=='cart'&&cnt()?`<b class="bd ${cnt()!==pc?'pop':''}">${cnt()}</b>`:''}</button>`).join('')+`<div class="who">${u?`<b>${esc(u.name)}</b><small>${u.role}</small>`:'Not signed in'}</div>`;
 $('#app').innerHTML=`<div class="demo">Demo mode: sample data, in-memory. GCash is a placeholder and is never marked paid.</div>`+(V[S.view]||V.home)()}
const stat=c=>c.open?'<span class="tag g live">Open</span>':'<span class="tag x">Closed</span>';
const canteenCard=c=>`<div class="card"><div class="pic">${c.emoji}</div><div class="row"><b>${c.name}</b>${stat(c)}</div><div>${c.tag}</div><div class="mut">🕒 ${c.hours} · ⏱ ~${c.prep} min prep · ${S.foods.filter(f=>f.c==c.id&&f.avail).length} items available</div><button class="btn" onclick="go('menu',{cid:'${c.id}',cat:'All',q:''})">View menu</button></div>`;
const foodCard=f=>{const c=cn(f.c),ok=f.avail&&c.open;return`<div class="card"><div class="pic">${f.emoji}</div><div class="row"><b>${esc(f.name)}</b><span class="price">${peso(f.price)}</span></div><div class="mut">${esc(f.desc)}</div><div class="mut">${c.name} · ${f.cat}</div><div>${!f.avail?'<span class="tag x">Sold out</span>':!c.open?'<span class="tag x">Canteen closed</span>':'<span class="tag g">Available</span>'}${f.opts.length?' <span class="mut">Customizable</span>':''}</div><button class="btn" ${ok?'':'disabled'} onclick="openFood('${f.id}')">Add to cart</button></div>`};
const filt=()=>S.foods.filter(f=>(S.cid=='all'||f.c==S.cid)&&(S.cat=='All'||f.cat==S.cat)&&(!S.q||(f.name+f.desc+cn(f.c).name).toLowerCase().includes(S.q.toLowerCase()))).sort((a,b)=>S.sort=='lo'?a.price-b.price:S.sort=='hi'?b.price-a.price:S.sort=='az'?a.name.localeCompare(b.name):b.pop-a.pop);
const V={
home(){const act=S.orders.filter(o=>!['Completed','Cancelled'].includes(o.status));return`<div class="hero"><span class="fl f1">🍔</span><span class="fl f2">🧋</span><span class="fl f3">🍩</span><span class="fl f4">🍜</span><h1>What would you like to eat today?</h1><p>${esc(S.school)} · ${S.canteens.filter(c=>c.open).length} canteens open now</p><div class="bar"><input id="hq" placeholder="Search food or canteen" aria-label="Search" value="${esc(S.q)}" onkeydown="if(event.key=='Enter')go('menu',{q:this.value,cid:'all',cat:'All'})"><button class="btn" style="background:#fff;color:var(--red)" onclick="go('menu',{q:$('#hq').value,cid:'all',cat:'All'})">Search</button></div></div>
<div class="row"><button class="btn" onclick="go('cart')">🛒 My cart (${cnt()})</button><button class="btn o" onclick="go('orders')">Active orders (${act.length})</button></div>
<h2>Categories</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">${CATS.map(([n,i])=>`<button class="card" style="align-items:center;cursor:pointer" onclick="go('menu',{cat:'${n}',cid:'all',q:''})"><span style="font-size:40px">${i}</span><b>${n}</b></button>`).join('')}</div>
<h2>Popular foods</h2><div class="grid">${[...S.foods].sort((a,b)=>b.pop-a.pop).slice(0,4).map(foodCard).join('')}</div><h2>School canteens</h2><div class="grid">${S.canteens.map(canteenCard).join('')}</div>`},
canteens:()=>`<h1>Browse Canteens</h1><p class="sub">Order from several canteens in one cart. Switching canteens keeps your cart.</p><div class="grid">${S.canteens.map(canteenCard).join('')}</div>`,
menu(){const l=filt();return`<h1>Food Menu</h1><p class="sub">${S.cid=='all'?'All canteens':cn(S.cid).name+' · '+cn(S.cid).tag}</p><div class="bar"><input placeholder="Search food" aria-label="Search food" value="${esc(S.q)}" oninput="S.q=this.value;clearTimeout(V.t);V.t=setTimeout(()=>{render();$('#app input').focus()},250)"><select aria-label="Sort" onchange="S.sort=this.value;render()">${[['pop','Most popular'],['lo','Price: low to high'],['hi','Price: high to low'],['az','Name A–Z']].map(([v,t])=>`<option value="${v}" ${S.sort==v?'selected':''}>${t}</option>`).join('')}</select></div>
<div class="chips">${['all',...S.canteens.map(c=>c.id)].map(i=>`<button class="chip ${S.cid==i?'on':''}" onclick="S.cid='${i}';render()">${i=='all'?'All canteens':cn(i).name}</button>`).join('')}</div><div class="chips">${['All',...CATS.map(c=>c[0])].map(c=>`<button class="chip ${S.cat==c?'on':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div>
${l.length?`<div class="grid">${l.map(foodCard).join('')}</div>`:'<p class="sub">No food matches. Try another search or category.</p>'}`},
cart(){if(S.done)return confirmView();if(!S.cart.length)return`<h1>My Cart</h1><p class="sub">Your cart is empty. Add food from any canteen.</p><button class="btn" onclick="go('menu')">Browse menu</button>`;
 const g={};S.cart.forEach(i=>(g[i.c]=g[i.c]||[]).push(i));const tot=S.cart.reduce((s,i)=>s+i.unit*i.qty,0),u=S.user||{};
 return`<h1>My Cart</h1><p class="sub">Items are grouped by canteen. Each canteen prepares its own order.</p><div class="two"><div>${Object.entries(g).map(([c,items])=>`<div class="card" style="margin-bottom:14px"><div class="row"><b>${cn(c).name}</b>${stat(cn(c))}</div>${items.map(i=>`<div class="line row"><div>${i.emoji} <b>${esc(i.name)}</b><div class="mut">${i.opts.map(esc).join(' · ')}${i.note?' · “'+esc(i.note)+'”':''}</div><span class="price">${peso(i.unit)}</span></div><div class="qty"><button aria-label="Less" onclick="chq('${i.k}',-1)">−</button><b>${i.qty}</b><button aria-label="More" onclick="chq('${i.k}',1)">+</button><button class="btn o s" onclick="rm('${i.k}')">Remove</button></div></div>`).join('')}<div class="row line"><span>${cn(c).name} subtotal</span><b>${peso(items.reduce((s,i)=>s+i.unit*i.qty,0))}</b></div></div>`).join('')}<button class="btn o" onclick="S.cart=[];save();render()">Clear cart</button> <button class="btn o" onclick="go('menu')">Keep browsing</button></div>
<form class="card f" onsubmit="event.preventDefault();place(this)"><h2 style="margin:0">Checkout</h2><label>Name<input name="name" required maxlength="60" value="${esc(u.name||'')}"></label><label>Student or staff ID<input name="sid" maxlength="30" placeholder="Optional"></label><label>Pickup<select name="pickupType"><option value="counter">At each canteen counter</option><option value="point">Designated pickup point</option></select></label><label>Preferred time<select name="pickupTime"><option>ASAP</option><option>Recess</option><option>Lunch break</option><option>After class</option></select></label><label>Payment<select name="payment"><option value="cash">Cash on pickup</option><option value="gcash">GCash (demo placeholder)</option></select></label><label>Order notes<textarea name="notes" maxlength="200" rows="2"></textarea></label>
<div class="line">${Object.entries(g).map(([c,items])=>`<div class="row"><span>Pay ${cn(c).name}</span><b>${peso(items.reduce((s,i)=>s+i.unit*i.qty,0))}</b></div>`).join('')}<div class="row"><span>Fees</span><b>₱0</b></div><div class="row"><b>Total</b><b class="price">${peso(tot)}</b></div></div><p class="mut">Each canteen prepares its order separately, and payment is collected at each canteen. Prices are re-verified by the server.</p><button class="btn" ${S.busy?'disabled':''}>${S.busy?'Placing order…':'Place order'}</button></form></div>`},
orders:()=>`<h1>My Orders</h1><p class="sub">Updates refresh automatically.</p>${S.orders.length?S.orders.map(o=>`<div class="card" style="margin-bottom:14px"><div class="row"><b>${o.id}</b><span class="tag">${o.status}</span></div><div class="mut">${new Date(o.createdAt).toLocaleString()} · ${o.pickupTime} · ${o.payment}</div>${o.vendors.map(v=>`<div class="line"><div class="row"><b>${v.canteenName}</b><span class="tag ${v.status=='Cancelled'?'x':''}">${v.status}</span></div><div class="mut">${v.items.map(i=>i.qty+'× '+esc(i.name)).join(', ')}</div>${v.status=='Cancelled'?'':`<div class="steps">${STEPS.map((s,n)=>`<i class="${n<=STEPS.indexOf(v.status)?'d':''} ${n==STEPS.indexOf(v.status)&&n<4?'cur':''}" style="--n:${n}"></i>`).join('')}</div><div class="mut">Est. ready in ~${cn(v.canteen).prep} min after acceptance · ${peso(v.subtotal)}</div>`}</div>`).join('')}<div class="row line"><b>Total ${peso(o.total)}</b><button class="btn o s" onclick="reorder('${o.id}')">Reorder</button></div></div>`).join(''):'<p class="sub">No orders yet.</p><button class="btn" onclick="go(\'menu\')">Order food</button>'}`,
account:()=>`<h1>Account</h1>${S.user?`<div class="card"><b>${esc(S.user.name)}</b><span class="mut">Role: ${S.user.role}</span><div><button class="btn o" onclick="localStorage.removeItem('tok');S.user=null;S.orders=[];S.view='home';boot()">Sign out</button></div></div>`:''}<h2>Demo accounts</h2><div class="grid">${[['student','Student','Order food'],['vendor','Canteen A vendor','Manage orders'],['vendorb','Canteen B vendor','Manage orders'],['admin','Administrator','Manage system']].map(([u,n,d])=>`<div class="card"><b>${n}</b><span class="mut">${d}</span><button class="btn" onclick="login('${u}')">Sign in</button></div>`).join('')}</div>`,
vendor(){return dash(false)},admin(){return dash(true)}};
function dash(ad){const s=S.stats||{best:[]};const mine=ad?S.canteens:S.canteens.filter(c=>c.id==S.user.canteen);
 return`<h1>${ad?'Admin Dashboard':'Vendor Dashboard · '+mine[0].name}</h1><p class="sub">${ad?'All canteens':'Your canteen only'}</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">${[['Orders today',s.ordersToday],['Sales today',peso(s.salesToday||0)],['Active canteens',s.activeCanteens],['Pending',s.pending]].map(([l,v])=>`<div class="card stat"><span class="mut">${l}</span><b>${v}</b></div>`).join('')}</div>
<h2>Canteens</h2>${mine.map(c=>`<div class="card row" style="margin-bottom:8px"><b>${c.name} ${stat(c)}</b><button class="btn o s" onclick="api('canteens/${c.id}','PATCH',{open:${!c.open}}).then(()=>refresh())">${c.open?'Close canteen':'Open canteen'}</button></div>`).join('')}
<h2>Orders</h2>${S.vos.length?S.vos.map(v=>{const n=STEPS.indexOf(v.status);return`<div class="card" style="margin-bottom:10px"><div class="row"><b>${v.id} · ${esc(v.customer)}</b><span class="tag">${v.status}</span></div><div>${v.items.map(i=>`${i.qty}× ${esc(i.name)} ${i.opts.length?'('+i.opts.map(esc).join(', ')+')':''}`).join('<br>')}</div><div class="mut">${v.canteenName} · ${peso(v.subtotal)} · ${esc(v.pickup)} · ${esc(v.payment)}${v.notes?' · Note: '+esc(v.notes):''}</div><div class="row">${n>=0&&n<4?`<button class="btn s" onclick="setSt('${v.id}','${STEPS[n+1]}')">${n==0?'Accept':'Mark: '+STEPS[n+1]}</button>`:'<span></span>'}${n==0?`<button class="btn o s" onclick="setSt('${v.id}','Cancelled')">Reject</button>`:''}</div></div>`}).join(''):'<p class="sub">No orders yet.</p>'}
<h2>Menu availability</h2><table><tr><th>Item</th><th>Canteen</th><th>Price</th><th></th></tr>${S.foods.filter(f=>ad||f.c==S.user.canteen).map(f=>`<tr><td>${f.emoji} ${esc(f.name)}</td><td>${cn(f.c).name}</td><td>${peso(f.price)}</td><td><button class="btn o s" onclick="api('foods/${f.id}','PATCH',{avail:${!f.avail}}).then(()=>refresh())">${f.avail?'Mark sold out':'Mark available'}</button></td></tr>`).join('')}</table>
<h2>Best sellers</h2><p>${s.best.map(b=>b[0]+' ('+b[1]+')').join(', ')||'No sales yet.'}</p><button class="btn o" onclick="csv()">Export CSV</button>`}
async function csv(){const t=await api('export'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='schoolbites-orders.csv';a.click()}
async function refresh(){await load();render()}
async function setSt(id,s){try{await api('vendor-orders/'+id,'PATCH',{status:s});refresh()}catch(e){toast(e.message,1)}}
function openFood(id){const f=fd(id);S.m={f,qty:1,sel:Object.fromEntries(f.opts.filter(o=>!o.multi).map(o=>[o.n,[o.c[0].n]])),note:''};modal()}
const mprice=()=>{const m=S.m;let p=m.f.price;m.f.opts.forEach(o=>o.c.forEach(c=>{if((m.sel[o.n]||[]).includes(c.n))p+=c.p}));return p};
function pick(g,n,multi){const s=S.m.sel[g]=S.m.sel[g]||[];if(multi){const i=s.indexOf(n);i<0?s.push(n):s.splice(i,1)}else S.m.sel[g]=[n];modal()}
function modal(){const m=S.m;$('#m').innerHTML=`<div class="ov" onclick="if(event.target==this)closeM()"><div class="modal" role="dialog" aria-label="${esc(m.f.name)}"><div class="pic">${m.f.emoji}</div><h2 style="margin:8px 0">${esc(m.f.name)}</h2><p class="mut">${esc(m.f.desc)}</p>${m.f.opts.map(o=>`<b>${o.n}${o.multi?' (optional)':''}</b>${o.c.map(c=>`<button class="opt ${(m.sel[o.n]||[]).includes(c.n)?'on':''}" onclick="pick('${o.n}','${c.n}',${o.multi})"><span>${c.n}</span><span>${c.p?'+'+peso(c.p):'Free'}</span></button>`).join('')}`).join('')}<div class="f"><label>Special instructions<input id="mn" maxlength="120" value="${esc(m.note)}" oninput="S.m.note=this.value"></label></div><div class="row line"><div class="qty"><button aria-label="Less" onclick="S.m.qty=Math.max(1,S.m.qty-1);modal()">−</button><b>${m.qty}</b><button aria-label="More" onclick="S.m.qty=Math.min(20,S.m.qty+1);modal()">+</button></div><button class="btn" onclick="addCart()">Add · ${peso(mprice()*m.qty)}</button></div></div></div>`}
const closeM=()=>{$('#m').innerHTML='';S.m=null};
function addCart(){const m=S.m,opts=m.f.opts.flatMap(o=>(m.sel[o.n]||[]).map(n=>o.n+': '+n)),k=m.f.id+'|'+opts.join()+'|'+m.note,ex=S.cart.find(i=>i.k==k);
 ex?ex.qty+=m.qty:S.cart.push({k,id:m.f.id,c:m.f.c,name:m.f.name,emoji:m.f.emoji,unit:mprice(),qty:m.qty,opts,note:m.note});fly(m.f.emoji);save();closeM();toast(m.f.name+' added to cart');render()}
function chq(k,d){const i=S.cart.find(x=>x.k==k);i.qty=Math.max(1,Math.min(20,i.qty+d));save();render()}
function rm(k){S.cart=S.cart.filter(i=>i.k!=k);save();render()}
async function place(f){if(S.busy)return;if(!S.user)return toast('Sign in from Account to place an order.',1);
 const d=Object.fromEntries(new FormData(f));S.busy=true;render();
 try{const o=await api('orders','POST',{...d,key:S.key,items:S.cart.map(i=>({foodId:i.id,qty:i.qty,opts:i.opts,note:i.note}))});S.done=o;setTimeout(confetti,80);S.cart=[];save();S.key=crypto.randomUUID();S.orders=await api('orders')}
 catch(e){toast(e.message,1);S.foods=await api('foods');S.canteens=await api('canteens')}S.busy=false;render()}
const confirmView=()=>`<div class="card" style="max-width:520px"><svg class="chk" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26.5"/><path d="M18 31l8 8 16-17"/></svg><h1>Order placed</h1><p>Order number <b class="price">${S.done.id}</b></p>${S.done.vendors.map(v=>`<div class="row line"><span>${v.canteenName}</span><b>${peso(v.subtotal)}</b></div>`).join('')}<div class="row line"><b>Total</b><b>${peso(S.done.total)}</b></div><p class="mut">${S.done.payment}. Pay each canteen when you pick up.</p><button class="btn" onclick="S.done=null;go('orders')">Track my order</button></div>`;
function reorder(id){const o=S.orders.find(x=>x.id==id);let n=0;o.vendors.forEach(v=>v.items.forEach(i=>{const f=fd(i.foodId);if(!f.avail||!cn(f.c).open)return;const k=f.id+'|'+i.opts.join()+'|'+i.note,ex=S.cart.find(x=>x.k==k);ex?ex.qty+=i.qty:S.cart.push({k,id:f.id,c:f.c,name:f.name,emoji:f.emoji,unit:i.unit,qty:i.qty,opts:i.opts,note:i.note});n++}));save();toast(n?'Items added to cart':'Those items are unavailable right now',!n);if(n)go('cart')}
const calm=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
function fly(e){const s=$('.modal .pic'),t=$('.nv[data-k=cart]');if(!s||!t||calm())return;const a=s.getBoundingClientRect(),b=t.getBoundingClientRect(),d=document.createElement('div'),x=a.left+a.width/2-20,y=a.top+20;d.className='fly';d.textContent=e;d.style.cssText=`left:${x}px;top:${y}px`;document.body.appendChild(d);d.animate([{transform:'scale(1.5)',opacity:1},{transform:`translate(${b.left+24-x}px,${b.top+8-y}px) scale(.4)`,opacity:.4}],{duration:750,easing:'cubic-bezier(.5,-.3,.7,.6)'}).onfinish=()=>d.remove()}
function confetti(){if(calm())return;for(let i=0;i<40;i++){const d=document.createElement('div');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=['#d62839','#ff7a85','#ffd166','#1f9d55','#fff'][i%5];document.body.appendChild(d);d.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translate(${Math.random()*160-80}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`,opacity:.8}],{duration:1600+Math.random()*1400,delay:Math.random()*400,easing:'cubic-bezier(.3,.6,.5,1)'}).onfinish=()=>d.remove()}}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.25)}catch{}}
function poll(){clearInterval(poll.t);poll.t=setInterval(async()=>{if(!S.user||S.m||S.busy||document.activeElement?.matches('input,textarea,select'))return;try{const sg=JSON.stringify([S.orders,S.vos,S.foods,S.canteens,S.stats]);await load();if(S.user.role!=='student'){const p=S.vos.filter(v=>v.status=='Pending Confirmation').length;if(S.seen>=0&&p>S.seen){beep();toast('New order received')}S.seen=p}if(sg!==JSON.stringify([S.orders,S.vos,S.foods,S.canteens,S.stats]))render()}catch{}},5000)}
async function boot(){const c=await api('config');S.school=c.school;if(localStorage.tok){try{S.user=(await api('me')).user}catch{}}
 if(!S.user)return login('student');await load();render();poll()}
boot();
</script></body></html>
